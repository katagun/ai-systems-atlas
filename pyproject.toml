[project]
name = "ai-systems-atlas"
version = "0.1.0"
description = "A reviewed atlas of operational memory, agent, and assistant systems"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Shamil Assylbekov" }]
dependencies = []

[dependency-groups]
dev = [
    "coverage==7.10.1",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
# The floor is 3.12, and the floor is the tested version: verify.yml pins 3.12 in
# every job, so this catches syntax that parses on 3.13 but not on what CI runs.
# It was py311 until 2026-09-28, when the floor turned out to be broken rather than
# merely untested — Python 3.12 made sum() of floats compensated, and the stored
# editorial scores were computed under 3.12, so validate_directory.py rejected
# seven records on 3.11 (CR-13 in docs/CODEBASE_REVIEW_2026-09-28.md). Raising the
# floor is the cheap fix; rounding the weighted sum instead would have meant
# rewriting human-owned scores, which working rule 8 forbids.
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",    # pyflakes: undefined names, unused imports and variables
    "E4",   # pycodestyle: import placement
    "E7",   # pycodestyle: statement-level mistakes
    "E9",   # pycodestyle: syntax and IO errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade: modern syntax for the declared target version
    "B",    # bugbear: likely bugs and footguns
    "SIM",  # simplifiable constructs
    "RUF",  # ruff's own checks
    "C901", # mccabe: cyclomatic complexity ratchet (see mccabe below)
]
# E501 is deliberately absent, matching ruff's own default. The catalog
# validators carry long quoted error messages, and rewrapping them to satisfy a
# column limit would hurt the diffs without catching a single defect.

[tool.ruff.lint.mccabe]
# Complexity ratchet, not a target: 50 passes today (the current maximum is 46
# in validate_hn_signals) and fails any new function worse than the worst one
# already carried. Tighten toward 10 as the validators are decomposed; every
# reduction must come with the refactor, never with a noqa.
max-complexity = 50

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
# Coverage ratchet, not a target: 79 is today's measured total across scripts/.
# Fails any change that drops below it. Raise as untested branches gain tests;
# every increase must come with the tests, never with new omits.
fail_under = 79
show_missing = true
skip_covered = true
