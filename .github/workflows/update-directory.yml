name: Refresh AI systems directory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: directory-refresh
  cancel-in-progress: false

env:
  REFRESH_BRANCH: automation/directory-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The refresh parses third-party feeds and search results before it
          # pushes. Withhold the push credential until the publishing step so
          # untrusted input is never handled beside a writable token.
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --locked
      - name: Install icon packages
        run: npm ci --ignore-scripts
      - name: Refresh GitHub metadata and discover candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/update_directory.py
      - name: Refresh models.dev candidate metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/import_models_dev.py
      - name: Regenerate app payloads
        run: uv run python scripts/build_web_payload.py
      - name: Regenerate share pages
        run: uv run python scripts/build_share_pages.py
      - name: Regenerate asset versions
        # A refresh changes the published catalog files, and index.html carries a
        # content hash for each thing it serves. Regenerate here or the refresh
        # opens a pull request that fails the asset-version check every week.
        run: node scripts/build_asset_version.mjs
      - name: Verify the refreshed catalog
        id: verify
        # A refreshed catalog that fails verification is still worth publishing
        # to the refresh branch: the failure is repaired on that branch instead
        # of discarding a full crawl and waiting a week for the next schedule.
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          results="${RUNNER_TEMP}/verification.md"
          logos="${RUNNER_TEMP}/logo-coverage.txt"
          : > "${results}"

          check() {
            local name="$1"
            shift
            echo "::group::${name}"
            if "$@"; then
              echo "- \`${name}\` passed" >> "${results}"
            else
              echo "- \`${name}\` **failed**" >> "${results}"
              status=1
            fi
            echo "::endgroup::"
          }

          logo_coverage() {
            node scripts/build_logos.mjs --check 2>&1 | tee "${logos}"
            return "${PIPESTATUS[0]}"
          }

          stage_and_check_whitespace() {
            git add -A directory web && git diff --cached --check
          }

          check "validate_directory" uv run python scripts/validate_directory.py
          check "unittest" uv run python -m unittest discover -s tests -v
          check "compileall" uv run python -m compileall scripts tests
          check "share page freshness" uv run python scripts/build_share_pages.py --check
          check "app payload freshness" uv run python scripts/build_web_payload.py --check
          check "asset versions" node scripts/build_asset_version.mjs --check
          check "app-core.js syntax" node --check web/app-core.js
          check "app.js syntax" node --check web/app.js
          check "web behavior tests" node --test tests/test_web.js
          check "logo coverage" logo_coverage
          check "generated diff whitespace" stage_and_check_whitespace

          {
            echo "## Weekly refresh verification"
            echo
            cat "${results}"
            echo
            echo "<details><summary>Logo coverage</summary>"
            echo
            echo '```'
            cat "${logos}" 2>/dev/null || echo "the logo check did not produce a report"
            echo '```'
            echo
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      - name: Open or update the refresh pull request
        # Runs even when an earlier step failed so a partial or failing refresh
        # is still recoverable from the branch rather than lost with the runner.
        if: always()
        env:
          # A pull request opened with GITHUB_TOKEN never triggers the required
          # `verify` check. Prefer a maintainer-supplied token so the refresh
          # pull request can actually reach a mergeable state.
          GH_TOKEN: ${{ secrets.ATLAS_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail

          gh auth setup-git

          git add -A directory web
          if git diff --cached --quiet; then
            echo "No directory changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(directory): weekly GitHub refresh"

          branch="${REFRESH_BRANCH}"
          remote_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)"
          if [[ -n "${remote_sha}" ]]; then
            git push --force-with-lease="refs/heads/${branch}:${remote_sha}" \
              origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          results="$(cat "${RUNNER_TEMP}/verification.md" 2>/dev/null || echo '- verification did not run')"
          if [[ "${VERIFY_OUTCOME}" == "success" ]]; then
            title="chore(directory): weekly GitHub refresh"
            state="Verification passed on the runner."
          else
            title="chore(directory): weekly GitHub refresh (verification failed)"
            state="**Verification failed on the runner.** Repair this branch and push; do not merge it as it stands."
          fi
          body="$(printf 'Automated metadata refresh and candidate discovery.\n\n%s\n\n%s\n\n[Workflow run](%s)\n\nReview license incidents and candidate additions before merging.\n' \
            "${state}" "${results}" "${run_url}")"

          number="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${number}" ]]; then
            create=(gh pr create --base "${DEFAULT_BRANCH}" --head "${branch}" --title "${title}" --body "${body}")
            if [[ "${VERIFY_OUTCOME}" != "success" ]]; then
              create+=(--draft)
            fi
            "${create[@]}"
          else
            gh pr edit "${number}" --title "${title}" --body "${body}"
            draft="$(gh pr view "${number}" --json isDraft --jq .isDraft)"
            if [[ "${VERIFY_OUTCOME}" == "success" && "${draft}" == "true" ]]; then
              gh pr ready "${number}"
            elif [[ "${VERIFY_OUTCOME}" != "success" && "${draft}" == "false" ]]; then
              gh pr ready "${number}" --undo
            fi
          fi
      - name: Fail when the refreshed catalog did not verify
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::The refreshed catalog failed verification. Repair the refresh branch." >&2
          exit 1

  report-failure:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the refresh failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          title="Weekly directory refresh is failing"
          note="Run [#${GITHUB_RUN_NUMBER}](${run_url}) failed on $(date -u +%Y-%m-%d)."

          gh label create automation-failure \
            --repo "${REPO}" \
            --color B60205 \
            --description "A scheduled workflow failed and needs a maintainer" \
            2>/dev/null || true

          number="$(gh issue list --repo "${REPO}" --state open --label automation-failure \
            --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -z "${number}" ]]; then
            gh issue create --repo "${REPO}" --title "${title}" --label automation-failure \
              --body "$(printf '%s\n\nThe scheduled catalog refresh did not complete. Check the run log, then re-run the workflow once the cause is fixed.\n\nThis issue is reused for later failures and can be closed once a refresh succeeds.\n' "${note}")"
          else
            gh issue comment "${number}" --repo "${REPO}" --body "${note}"
          fi
