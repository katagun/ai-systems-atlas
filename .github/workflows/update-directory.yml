name: Refresh open-source systems directory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Refresh GitHub metadata and discover candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/update_directory.py
      - name: Validate directory
        run: uv run python scripts/validate_directory.py
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo "No directory changes"
            exit 0
          fi
          git config user.name "memory-systems-atlas-bot"
          git config user.email "memory-systems-atlas-bot@users.noreply.github.com"
          git add directory web
          git commit -m "chore(directory): weekly GitHub refresh"
          git push
