name: Verify AI Systems Atlas

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Full lint, Python coverage and secret history audit; browsers stay local.
    - cron: "17 9 * * 0"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Keep the required workflow unconditional. Only the expensive Python regression
# suite is skipped for known content/web-only changes; quick checkout contracts
# and freshness always run. Browser tests remain in the local pre-push hook.
jobs:
  changes:
    name: select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
      python_tests: ${{ steps.plan.outputs.python_tests }}
      lint_all: ${{ steps.plan.outputs.lint_all }}
      full_history: ${{ steps.plan.outputs.full_history }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ancestor search includes canceled pushes and every PR commit.
          fetch-depth: 0
      - name: Select checks from the complete change range
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_changes.py plan

  static:
    name: static checks and freshness
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Gitleaks scans the selected commits, including intermediate edits.
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --locked
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Install pre-commit
        run: pipx install pre-commit==4.6.2
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{
            hashFiles('.pre-commit-config.yaml', 'pyproject.toml', 'uv.lock') }}
      - name: Scan new commits or audit full history
        env:
          ATLAS_GITLEAKS_BASE: ${{ needs.changes.outputs.full_history == 'false' && needs.changes.outputs.base || '' }}
          ATLAS_GITLEAKS_HEAD: ${{ needs.changes.outputs.head }}
        run: pre-commit run --all-files gitleaks
      - name: Run scoped lint and the always-on fast hooks
        env:
          ATLAS_CI_BASE: ${{ needs.changes.outputs.base }}
          ATLAS_CI_LINT_ALL: ${{ needs.changes.outputs.lint_all }}
        run: uv run python scripts/ci_changes.py lint
      - name: Check documentation, catalog and web contracts
        run: uv run python scripts/run_content_checks.py

  python:
    name: python tests under coverage
    needs: changes
    if: needs.changes.outputs.python_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --locked
      - name: Run the complete Python suite and coverage gate
        run: uv run python scripts/run_python_tests.py

  verify:
    name: verify
    needs: [changes, static, python]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected checks to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          PYTHON_EXPECTED: ${{ needs.changes.outputs.python_tests }}
        run: |
          if [ "$CHANGES_RESULT" != success ] || [ "$STATIC_RESULT" != success ]; then
            echo "change selection and static checks must both succeed"
            exit 1
          fi
          case "$PYTHON_EXPECTED:$PYTHON_RESULT" in
            true:success|false:skipped|false:success) ;;
            *) echo "a selected check failed, was canceled, or was unexpectedly skipped"; exit 1 ;;
          esac
