name: Verify AI Systems Atlas

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --locked
      - name: Validate directory
        run: uv run python scripts/validate_directory.py
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: uv run python -m compileall scripts tests
      - name: Check browser JavaScript syntax
        run: node --check web/app-core.js && node --check web/app.js
      - name: Run web behavior tests
        run: node --test tests/test_web.js
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npm exec -- playwright install --with-deps chromium
      - name: Check logo coverage and freshness
        run: node scripts/build_logos.mjs --check
      - name: Check vendored font freshness
        run: node scripts/build_fonts.mjs --check
      - name: Run browser end-to-end tests
        run: npm run test:e2e
