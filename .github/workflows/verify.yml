name: Verify Agent Systems Atlas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --locked
      - name: Validate directory
        run: uv run python scripts/validate_directory.py
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: uv run python -m compileall scripts tests
      - name: Check browser JavaScript syntax
        run: node --check web/app-core.js && node --check web/app.js
      - name: Run web behavior tests
        run: node --test tests/test_web.js
