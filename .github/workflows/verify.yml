name: Verify AI Systems Atlas

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --locked
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npm exec -- playwright install --with-deps chromium
      - name: Install pre-commit
        run: pipx install pre-commit
      # The whole gate lives in .pre-commit-config.yaml: lint, format,
      # secrets, complexity, catalog validation, unit tests with coverage,
      # syntax and web behavior checks, generated-file freshness, and e2e.
      # This job is environment setup plus that one command.
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
