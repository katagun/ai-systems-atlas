name: Deploy AI Systems Atlas to Pages

on:
  workflow_run:
    workflows:
      - Verify AI Systems Atlas
    types:
      - completed
    branches:
      - main

# No manual trigger: a hand-started run could publish a revision that never
# passed the complete verify workflow (CR-04). To retry a failed publication,
# re-run the current main revision's push-triggered verify run; see docs/OPERATIONS.md.

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    permissions:
      contents: read
      deployments: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          # Compare against the actual deployed commit, even after failed/canceled runs.
          fetch-depth: 0
      - name: Check publication changes since the last successful deployment
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/check_deploy_changes.py
      # ADR 050: this is the only place content hashes are written. Committed pages carry
      # the placeholder `?v=BUILD`, so no ordinary branch can produce the hash-only merge
      # conflict this replaces. Verification already passed for this checkout. The
      # stamper only imports Node built-ins, so publishing needs no dependency install.
      - name: Stamp asset versions for deploy
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/build_asset_version.mjs
      - name: Check every published reference resolved to a content hash
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/build_asset_version.mjs --stamped
      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
