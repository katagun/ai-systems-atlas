version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: America/Denver
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # An icon-package bump changes the vendored SVG sources, so web/logos.json
    # must be regenerated in the same change or the logo-coverage check fails.
    # Dependabot cannot run the generator; the weekly refresh
    # (scripts/run_directory_refresh.py) bumps these two and regenerates.
    ignore:
      - dependency-name: simple-icons
      - dependency-name: "@lobehub/icons-static-svg"
    commit-message:
      prefix: "chore(npm)"
    labels:
      - dependencies
  # The seven tool versions outside package.json: three `rev:` entries and four
  # `uvx tool@version` entries. docs/OPERATIONS.md requires each to be bumped
  # deliberately, one tool at a time, with the full verification after each --
  # so these ecosystems open one pull request per tool rather than a sweeping
  # autoupdate, and the schedule is staggered so two never land together.
  # A bump is a proposal for that policy, not a substitute for it: review the
  # diff, since a new codespell dictionary or a stricter ruff default turns a
  # green tree red for reasons unrelated to the version change.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(pre-commit)"
    labels:
      - dependencies
  # ruff and coverage, through uv.lock. The npm entry above keeps two icon
  # packages out of Dependabot's hands because a bump changes vendored bytes;
  # Python needs no such carve-out, since no generator reads site-packages.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Denver
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(uv)"
    labels:
      - dependencies
