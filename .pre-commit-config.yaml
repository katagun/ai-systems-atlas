# Pre-commit gates for AI Systems Atlas.
#
# Install once per checkout:  pre-commit install
# Run every local check:  pre-commit run --all-files --hook-stage pre-push
#
# Every hook runs on `git commit` except unit tests under coverage and browser
# e2e, which run on `git push` instead (`stages: [pre-push]`). `pre-commit install`
# installs both hook types through default_install_hook_types below. GitHub CI
# scopes lint and Python tests to affected files and never runs browser tests;
# see verify.yml. The full local command above remains available for any change.
# Complexity is enforced through ruff C901 (Python, max 50) and the eslint
# complexity rule (JS, max 40); both are ratchets documented in
# pyproject.toml and eslint.config.mjs, tightened by refactor, never by noqa.

default_install_hook_types: [pre-commit, pre-push]

repos:
  # Generic file hygiene, language-independent. check-merge-conflict is the
  # backstop for leftover conflict markers; no-commit-to-branch keeps commits
  # off main (branch protection requires PRs anyway); check-added-large-files
  # guards the ~672K catalog JSON files with a 1000K ceiling.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: no-commit-to-branch
        args: [-b, main]
      - id: check-added-large-files
        args: [--maxkb=1000]

  # Local secrets gate: full-history `gitleaks git`, including manual all-files
  # runs. CI invokes this hook separately with a validated commit range, plus a
  # periodic full-history audit. The remote hook installs the pinned binary;
  # the wrapper selects the range and keeps tool arguments shared.
  # Known-safe test fixtures live in .gitleaks.toml, never inline.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: uv run python scripts/scan_secrets.py
        always_run: true
        pass_filenames: false

  # Python lint + format, pinned to the ruff in the pyproject.toml dev group.
  # types_or is narrowed to Python sources on purpose: ruff would otherwise
  # also reformat ```python snippets inside Markdown (e.g. the frozen
  # docs/superpowers planning archive), which are historical records, not code.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  # Project-specific checks run with the repo's own toolchain (uvx / npm) so
  # versions stay in uv cache and package-lock.json instead of drifting in
  # hook revs. Pinned versions are in each entry; bump them deliberately.
  - repo: local
    hooks:
      # Security: bug and hardening scan at medium severity and above. Low
      # findings (git-subprocess plumbing) are noise here; the five medium
      # sites carry `# nosec` with their allowlist justification inline.
      - id: bandit
        language: system
        name: bandit (medium+ severity)
        entry: uvx bandit@1.9.4
        args: [-ll, -q]
        types: [python]

      # Spelling across sources and the human-curated catalog. Generated
      # copies (web/records, web/app, web/blog, web/fonts, synced web/*.json,
      # sitemap), machine files (locks, vendored deps), and transient or
      # upstream-imported queues are excluded: they mirror checked sources.
      # The ignore list holds product names and house spellings (Slite, Asure,
      # the peacefulcoexistance wordmark fragment nce, and coexistance itself
      # in prose about the brand); real typos get fixed.
      # assertin covers unittest's assertIn API used across the test suite.
      - id: codespell
        language: system
        name: codespell typo scan
        entry: uvx codespell@2.3.0
        args: [-L, "slite,asure,grup,unparseable,nce,coexistance,newyorker,commitable,ake,assertin,assertIn,nams"]
        types: [text]
        exclude: |
          (?x)^(
            node_modules/|\.venv/|
            uv\.lock|package-lock\.json|
            web/(records|app|blog|fonts)/|
            web/[^/]*\.json|web/sitemap\.xml|web/robots\.txt|
            directory/(hn-signals|model-candidates|models-dev|openrouter-model-leads)\.json
          )

      # YAML workflows and routines against .yamllint.yml.
      - id: yamllint
        language: system
        name: yamllint
        entry: uvx yamllint@1.37.1
        args: [-c, .yamllint.yml]
        types: [yaml]

      # Markdown prose against .markdownlint-cli2.jsonc. --no-globs keeps the
      # hook scoped to supplied filenames; the config's ignores still apply.
      # --fix formats safe issues on commit (blank lines, fence spacing,
      # bare-URL brackets); the commit fails so the author reviews the fix.
      # Resolved from node_modules (see package.json); --yes keeps CI
      # non-interactive should the local install ever be missing.
      - id: markdownlint
        language: system
        name: markdownlint-cli2
        entry: npx --yes markdownlint-cli2
        args: [--fix, --no-globs, --]
        types: [markdown]

      # Static HTML source (generated share pages under web/records and the
      # generated blog under web/blog are owned by their builders).
      - id: htmlhint
        language: system
        name: htmlhint
        entry: npx --yes htmlhint
        args: [--config, .htmlhintrc]
        types: [html]
        exclude: ^web/(records|blog)/

      # Stylesheets (web/fonts.css is vendored by scripts/build_fonts.mjs).
      - id: stylelint
        language: system
        name: stylelint
        entry: npx --yes stylelint
        types: [css]
        exclude: ^web/fonts\.css$

      # Browser bundle, build scripts, and Node tests through the repo's own
      # eslint flat config (which already ignores generated trees).
      - id: eslint
        language: system
        name: eslint (repo config)
        entry: npx --yes eslint
        args: [--max-warnings=0, --no-warn-ignored, --]
        types: [javascript]

      # GitHub Actions security audit; findings suppressed with justification
      # in .github/zizmor.yml, never inline.
      - id: zizmor
        language: system
        name: zizmor workflow audit
        entry: uvx zizmor@1.11.0
        args: [--no-progress, --format, plain]
        files: ^\.github/workflows/

  # Project verification: local hooks keep the full checks, while CI selects
  # its Python suite from the change scope. always_run keeps these checks on each
  # local commit or push; pass_filenames keeps the commands intact. Unit tests
  # and e2e carry `stages: [pre-push]` and run on push. Browser tests are local
  # only; GitHub verification does not install or run Chromium.
  # Bypass one check with SKIP=<hook-id>. To skip only the browser suite on a push, use
  # SKIP=e2e-browser-tests preserves the other checks, including freshness.
  #
  # Prefer SKIP over git push --no-verify / git commit --no-verify, which is all of them.
  # Nothing in pre-commit can survive --no-verify, including the 0.8s staleness gate, and
  # that is how web/logos.json reached CI on 2026-09-30 carrying a package version CI did
  # not install: two pushes went out with the check that would have caught it bypassed.
  # CI still gates the merge either way.
  - repo: local
    hooks:
      - id: validate-directory
        language: system
        name: validate directory catalog
        entry: uv run python scripts/validate_directory.py
        always_run: true
        pass_filenames: false

      # The runner clears git's hook-specific environment so the suite's
      # scratch git repos (RealGit tests) resolve on their own.
      - id: python-tests-coverage
        language: system
        name: python tests under coverage
        entry: uv run python scripts/run_python_tests.py
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      # python-compileall and node-syntax-check were removed on 2026-09-28 (CR-24).
      # Neither could catch anything the linters do not: pyproject selects ruff's E9
      # syntax and IO rules, which run over every file, and eslint parses web/app.js and
      # web/app-core.js at ecmaVersion 2023. Both hooks ran in the static CI job and were
      # restated in docs/OPERATIONS.md as required checks, so the cost was the false
      # assurance rather than the runtime.

      - id: node-web-tests
        language: system
        name: node web behavior tests
        entry: node --test --experimental-test-coverage tests/test_web.js
        always_run: true
        pass_filenames: false

      # One hook for every generated tree, because the list of them lives in
      # scripts/regenerate.py and a copy of that list in a second place is a list that
      # will drift. It replaced five separate freshness hooks, and the reason is concrete:
      # AGENTS.md's regeneration sequence had already drifted from the set of generators,
      # omitting build_logos.mjs, build_fonts.mjs, and build_blog.py, so following the
      # documented steps after a rebase left those three stale. `--check` writes nothing,
      # reports every failure rather than stopping at the first, and takes under a second
      # for all six steps, which is what makes it safe to leave on every commit and push.
      - id: generated-freshness
        language: system
        name: generated file freshness
        entry: uv run python scripts/regenerate.py --check
        always_run: true
        pass_filenames: false

      # Deliberately not a step in scripts/regenerate.py, and not a staleness check.
      # Since ADR 050 this asserts the opposite property: a committed page must carry the
      # ?v=BUILD placeholder and no content hash, because the hashes are written by the
      # deploy job. So it guards against a deploy build being committed, and folding it
      # into the six generated trees would make one failure read as the other.
      - id: freshness-assets
        language: system
        name: asset version freshness
        entry: node scripts/build_asset_version.mjs --check
        always_run: true
        pass_filenames: false

      # Local only. Install Chromium once: npx playwright install chromium.
      # Starts its own server per checkout; GitHub CI never runs this hook.
      - id: e2e-browser-tests
        language: system
        name: browser end-to-end tests
        entry: npm run test:e2e
        always_run: true
        pass_filenames: false
        stages: [pre-push]
